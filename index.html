<!doctype html>
<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flash Mask</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #080c0f;
    --panel: #12171b;
    --panel-2: #171d22;
    --line: #2b333a;
    --line-soft: rgba(255,255,255,.09);
    --text: #f6f7f8;
    --muted: #9aa3ab;
    --dim: #68727b;
    --flash: #ffe500;
    --flash-hover: #fff044;
    --danger: #ff6a70;
    --radius: 14px;
    --control-radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  button, textarea, input { font: inherit; }
  button, a { -webkit-tap-highlight-color: transparent; }
  button { color: inherit; }
  button:focus-visible, a:focus-visible, textarea:focus-visible, .file-label:focus-visible, .canvas-scrollbar:focus-visible { outline: 2px solid rgba(255,229,0,.8); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .app { width: 100%; height: 100%; padding: 4px 14px 14px; display: flex; flex-direction: column; gap: 6px; }
  .topbar { min-height: 38px; display: flex; align-items: center; justify-content: space-between; }
  .brand-row { display: flex; align-items: center; gap: 13px; min-width: 0; }
  .icon { width: 1.15em; height: 1.15em; display: inline-block; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .brand { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 650; letter-spacing: -.02em; white-space: nowrap; }
  .brand-mark { width: 31px; height: 25px; display: block; }
  .top-divider { width: 1px; height: 23px; background: var(--line); }
  .file-label { min-height: 34px; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 6px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; border-radius: 9px; font-size: 14px; font-weight: 550; }
  .file-label:hover { border-color: rgba(255,255,255,.22); background: var(--panel-2); }
  #source-file { display: none; }
  .language-toggle { min-width: 86px; min-height: 34px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); color: var(--text); padding: 6px 10px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer; font-size: 13px; }
  .language-toggle:hover { border-color: rgba(255,255,255,.22); background: var(--panel-2); }
  .language-toggle .icon { width: 17px; height: 17px; }
  .top-right { display: flex; align-items: center; gap: 16px; }
  .quiet-link { color: var(--muted); font-size: 12px; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; min-height: 30px; border: 0; background: transparent; padding: 0; cursor: pointer; white-space: nowrap; }
  .quiet-link:hover { color: var(--text); }
  .quiet-link .icon { width: 14px; height: 14px; }

  .layout { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(520px, 1fr) clamp(320px, 23.5vw, 350px); gap: 12px; }
  .layout.ready { grid-template-columns: minmax(520px, 1fr) clamp(310px, 23vw, 348px); }
  .workspace, .side-panel { min-width: 0; min-height: 0; border: 1px solid var(--line-soft); border-radius: var(--radius); background: var(--panel); overflow: hidden; }
  .workspace { position: relative; }
  .canvas-viewport { position: absolute; inset: 0; overflow: hidden; background: #0d1216; }
  .canvas-viewport::before { content: ""; position: absolute; inset: 0; opacity: .38; background-image: linear-gradient(45deg,#192026 25%,transparent 25%),linear-gradient(-45deg,#192026 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#192026 75%),linear-gradient(-45deg,transparent 75%,#192026 75%); background-size: 28px 28px; background-position: 0 0,0 14px,14px -14px,-14px 0; pointer-events: none; }
  .canvas-viewport.dragging::after { content: ""; position: absolute; inset: 2px; z-index: 10; border: 2px solid rgba(255,229,0,.72); border-radius: calc(var(--radius) - 2px); pointer-events: none; }
  .canvas-scrollbar { position: absolute; z-index: 6; border: 1px solid rgba(255,255,255,.09); border-radius: 999px; background: rgba(255,255,255,.12); box-shadow: 0 1px 3px rgba(0,0,0,.24); }
  .canvas-scrollbar.horizontal { left: 10px; right: 20px; bottom: 8px; height: 8px; }
  .canvas-scrollbar.vertical { top: 10px; right: 8px; bottom: 20px; width: 8px; }
  .canvas-scroll-thumb { position: absolute; border-radius: inherit; background: rgba(235,238,240,.7); box-shadow: 0 0 0 1px rgba(0,0,0,.28); cursor: grab; }
  .canvas-scroll-thumb:hover { background: rgba(246,248,249,.84); }
  .canvas-scroll-thumb:active { cursor: grabbing; background: rgba(255,255,255,.94); }
  .canvas-scrollbar.horizontal .canvas-scroll-thumb { top: 0; bottom: 0; left: 0; }
  .canvas-scrollbar.vertical .canvas-scroll-thumb { left: 0; right: 0; top: 0; }
  .empty-canvas { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; border: 1px solid rgba(255,229,0,.72); border-radius: var(--radius); }
  html.web-shell .empty-canvas { cursor: pointer; }
  html.web-shell .empty-canvas:hover { border-color: rgba(255,229,0,.92); background: rgba(255,229,0,.03); }
  .editor-focus[aria-pressed="true"] { border-color: rgba(255,229,0,.72); color: var(--flash); }
  .empty-upload { position: relative; text-align: center; color: var(--muted); max-width: 420px; padding: 24px; }
  .empty-file-icon { width: 72px; height: 82px; margin: 0 auto 22px; border-radius: 13px; background: linear-gradient(145deg,#747b84,#3d444c); opacity: .8; display: grid; place-items: center; color: #e4e7ea; }
  .empty-file-icon .icon { width: 34px; height: 34px; stroke-width: 1.6; }
  .empty-upload h1 { margin: 0; color: var(--text); font-size: 23px; letter-spacing: -.025em; }
  .empty-upload p { margin: 9px 0 0; font-size: 15px; }
  .choose-button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-width: 176px; min-height: 48px; margin-top: 22px; border: 1px solid var(--flash); border-radius: 8px; background: var(--flash); color: #111; font-size: 15px; font-weight: 700; cursor: pointer; }
  .choose-button:hover { background: var(--flash-hover); }

  #image-stage { position: absolute; z-index: 1; display: inline-block; transform-origin: top left; will-change: transform; line-height: 0; }
  #preview { display: block; max-width: none; user-select: none; pointer-events: none; }
  #selection-overlay { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
  .canvas-status { position: absolute; z-index: 5; left: 50%; top: 14px; transform: translateX(-50%); max-width: calc(100% - 32px); padding: 7px 11px; border: 1px solid var(--line-soft); border-radius: 999px; background: rgba(8,12,15,.78); color: var(--muted); backdrop-filter: blur(12px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
  .canvas-status.onboarding { padding: 8px 14px; border-color: rgba(255,229,0,.46); background: rgba(8,12,15,.92); color: var(--text); font-weight: 600; }

  .floating-toolbar { position: absolute; z-index: 7; left: 50%; bottom: 18px; transform: translateX(-50%); min-height: 56px; display: flex; align-items: center; gap: 4px; padding: 8px; border: 1px solid rgba(255,255,255,.16); border-radius: 18px; background: rgba(19,24,28,.94); box-shadow: 0 14px 35px rgba(0,0,0,.36); backdrop-filter: blur(14px); transition: opacity .12s ease; white-space: nowrap; }
  .floating-toolbar.drawing { opacity: .55; }
  .toolbar-handle { width: 32px; height: 40px; border: 0; background: transparent; color: var(--dim); cursor: grab; padding: 0 7px 0 1px; }
  .toolbar-handle:active { cursor: grabbing; }
  .tool-button { min-width: 40px; height: 40px; border: 0; border-radius: 10px; background: transparent; color: var(--text); cursor: pointer; padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
  .tool-button:hover:not(:disabled) { background: rgba(255,255,255,.07); }
  .tool-button:disabled { color: var(--dim); cursor: not-allowed; }
  .tool-separator { width: 1px; height: 27px; background: var(--line); margin: 0 4px; }
  .actual-size-button { min-width: 86px; }
  .actual-size-button .icon { width: 22px; height: 22px; }
  .zoom-label { min-width: 54px; text-align: center; font-variant-numeric: tabular-nums; }

  .context-menu { position: absolute; z-index: 12; min-width: 132px; padding: 5px; border: 1px solid rgba(255,255,255,.14); border-radius: 10px; background: #171c20; box-shadow: 0 12px 30px rgba(0,0,0,.45); }
  .context-menu button { width: 100%; min-height: 38px; border: 0; border-radius: 7px; background: transparent; color: var(--danger); text-align: left; cursor: pointer; }
  .context-menu button:hover { background: rgba(255,106,112,.1); }

  .side-panel { display: flex; flex-direction: column; padding: 16px; background: linear-gradient(145deg,#151b20,#11161a); }
  .empty-guide { height: 100%; display: flex; flex-direction: column; justify-content: flex-start; padding: clamp(62px,9vh,92px) 14px 22px; }
  .empty-guide h2 { margin: 0; max-width: 310px; font-size: clamp(30px,2.3vw,36px); line-height: 1.14; letter-spacing: -.045em; }
  .empty-guide > p { margin: 17px 0 0; color: var(--muted); font-size: 13px; line-height: 1.6; white-space: normal; text-wrap: balance; }
  .guide-rule { height: 1px; margin: 34px 0 38px; background: linear-gradient(90deg,rgba(255,229,0,.42),rgba(255,229,0,.06)); }
  .guide-steps { display: flex; flex-direction: column; align-items: stretch; }
  .guide-step { position: relative; display: grid; grid-template-columns: 44px minmax(0,1fr); align-items: center; column-gap: 14px; min-width: 0; min-height: 44px; padding-bottom: 26px; color: var(--text); font-size: 13px; line-height: 1.42; text-align: left; }
  .guide-step:last-child { padding-bottom: 0; }
  .guide-step:not(:last-child)::after { content: ""; position: absolute; left: 21px; top: 44px; bottom: 0; width: 1px; background: rgba(255,229,0,.26); }
  .guide-step > [data-i18n] { display: block; min-width: 0; text-wrap: balance; }
  html[lang="en"] .empty-guide h2 { max-width: 300px; font-size: 24px; line-height: 1.18; letter-spacing: -.03em; }
  html[lang="en"] .empty-guide > p { margin-top: 14px; line-height: 1.5; }
  html[lang="en"] .guide-rule { margin: 28px 0 30px; }
  html[lang="en"] .guide-step { font-size: 13px; line-height: 1.45; }
  .guide-icon { width: 44px; height: 44px; margin: 0; border: 1px solid rgba(255,229,0,.38); border-radius: 50%; display: grid; place-items: center; color: var(--flash); }
  .guide-icon .icon { width: 19px; height: 19px; }
  .guide-cases { max-width: 280px; margin-top: 32px; color: var(--text); font-size: 13px; line-height: 1.5; }
  html[lang="en"] .guide-cases { margin-top: 28px; }
  .guide-cases strong { color: var(--flash); }
  .guide-cases ul { display: grid; gap: 7px; margin: 10px 0 0; padding: 0; list-style: none; }
  .guide-cases li { position: relative; min-width: 0; padding-left: 14px; color: var(--muted); }
  .guide-cases li::before { content: ""; position: absolute; top: .7em; left: 0; width: 5px; height: 5px; border-radius: 50%; background: var(--flash); }

  .result-panel { min-height: 0; flex: 1; display: flex; flex-direction: column; }
  .panel-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .panel-heading h2, .prompt-title { margin: 0; font-size: 15px; font-weight: 620; }
  .region-count { color: var(--muted); font-size: 13px; }
  .json-shell { flex: 1; min-height: 160px; overflow-x: hidden; overflow-y: auto; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.2) transparent; border: 1px solid var(--line); border-radius: var(--control-radius); background: #11161a; }
  .json-shell::-webkit-scrollbar { width: 6px; }
  .json-shell::-webkit-scrollbar-track { background: transparent; }
  .json-shell::-webkit-scrollbar-thumb { border-radius: 999px; background: rgba(255,255,255,.2); }
  .json-shell::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.3); }
  #json-preview { margin: 0; padding: 14px 10px 18px 8px; color: #cfd5da; font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; counter-reset: line; }
  #json-preview .line { display: grid; grid-template-columns: 30px minmax(0,1fr); column-gap: 10px; min-height: 1.55em; white-space: pre-wrap; }
  #json-preview .line::before { counter-increment: line; content: counter(line); color: #56616a; text-align: right; user-select: none; }
  #json-preview .line-content { min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; }
  #json-preview .key { color: #f0c99a; } #json-preview .string { color: #d6a97b; } #json-preview .number, #json-preview .boolean { color: #e9d94d; } #json-preview .null { color: #8f98a1; }
  #json-output { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); }
  .empty-json { display: block; padding: 42px 18px; color: var(--muted); line-height: 1.6; text-align: center; white-space: normal; }
  .task-actions { padding-top: 16px; }
  .prompt-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 9px; }
  .prompt-optional { flex: none; padding: 2px 7px; border: 1px solid var(--line); border-radius: 999px; background: #181e23; color: var(--muted); font-size: 11px; font-weight: 560; line-height: 1.4; }
  #prompt-input { width: 100%; height: 94px; resize: none; border: 1px solid var(--line); border-radius: var(--control-radius); background: #11161a; color: var(--text); padding: 11px 12px 24px; outline: none; }
  #prompt-input:focus { border-color: #9d9561; }
  .prompt-wrap { position: relative; }
  .prompt-count { position: absolute; right: 10px; bottom: 7px; color: var(--muted); font-size: 12px; }
  .result-button { width: 100%; min-height: 48px; margin-top: 12px; border-radius: var(--control-radius); cursor: pointer; font-weight: 650; display: flex; align-items: center; justify-content: center; gap: 8px; }
  #copy-json { border: 1px solid var(--flash); background: var(--flash); color: #111; }
  #copy-json:hover:not(:disabled) { background: var(--flash-hover); }
  #download-mask { display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); background: transparent; color: var(--text); text-decoration: none; }
  #copy-json:disabled, #download-mask.disabled { opacity: .34; cursor: not-allowed; pointer-events: none; }

  @media (max-width: 1050px) {
    .app { padding: 10px; }
    .layout { grid-template-columns: minmax(420px,1fr) 286px; gap: 8px; }
    .layout.ready { grid-template-columns: minmax(420px,1fr) 286px; }
    .brand-row { gap: 8px; }
    .top-right { gap: 12px; }
    .side-panel { padding: 14px; }
    .empty-guide { padding: 54px 10px 16px; }
    .empty-guide h2 { font-size: 28px; }
    .guide-step { font-size: 11px; }
    .guide-rule { margin: 26px 0 30px; }
    .guide-cases { margin-top: 26px; }
  }
  @media (max-height: 600px) {
    .app { padding-top: 6px; gap: 6px; }
    .topbar { min-height: 36px; }
    .side-panel { padding: 10px; }
    .panel-heading { margin-bottom: 5px; }
    .json-shell { min-height: 76px; }
    #json-preview { padding-top: 8px; }
    .task-actions { padding-top: 8px; }
    .prompt-title { margin-bottom: 5px; }
    #prompt-input { height: 58px; }
    .result-button { min-height: 38px; margin-top: 7px; }
  }

  html.mac-notes .result-panel { gap: 0; }
  html.mac-notes .json-shell { flex: 0 0 160px; min-height: 0; }
  html.mac-notes .task-actions { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  html.mac-notes .prompt-title, html.mac-notes .result-button, html.mac-notes .panel-heading { flex: none; }
  html.mac-notes .note-navigation { height: 30px; flex: none; display: flex; align-items: center; gap: 6px; padding: 3px 7px 0; border: 1px solid var(--line); border-bottom: 0; border-radius: var(--control-radius) var(--control-radius) 0 0; background: #11161a; }
  html.mac-notes .prompt-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 0 0 var(--control-radius) var(--control-radius); background: #11161a; }
  html.mac-notes .prompt-wrap:focus-within { border-color: #9d9561; }
  html.mac-notes #prompt-input { flex: 1; min-height: 0; height: auto; border: 0; border-radius: 0; background: transparent; padding: 5px 11px 24px; }
  html.mac-notes #prompt-input:focus { border-color: transparent; }
  html.mac-notes #prompt-input:disabled { color: var(--muted); }
  html.mac-notes .areas { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: thin; min-width: 0; flex: 1; }
  html.mac-notes .area-tab { flex: none; height: 24px; min-width: 26px; border: 1px solid transparent; border-radius: 5px; background: transparent; color: var(--muted); font-size: 11px; cursor: pointer; position: relative; padding: 0 5px; }
  html.mac-notes .area-tab[aria-pressed="true"] { color: var(--flash); border-color: #67612d; background: #24251b; }
  html.mac-notes .area-tab.has-note::after { content: ""; position: absolute; right: 2px; top: 2px; width: 3px; height: 3px; border-radius: 50%; background: currentColor; }
  html.mac-notes #overall-tab { min-width: 60px; }
  html.mac-notes #delete-note-region { flex: none; border: 0; background: none; color: var(--muted); font-size: 11px; cursor: pointer; padding: 2px; }
  html.mac-notes #delete-note-region:disabled { opacity: .3; cursor: default; }
  .note-navigation[hidden] { display: none !important; }
  @media (max-height: 720px) {
    html.mac-notes .json-shell { flex-basis: 112px; }
  }
  @media (max-height: 660px) {
    html.mac-notes .note-navigation { height: 24px; }
    html.mac-notes .area-tab { height: 21px; }
  }
</style>
</head>

<script>
  (() => {
    'use strict';

    const contract = window.FlashMaskContract;
    const selectionCleaner = window.FlashMaskSelectionCleaner;
    const fileInput = document.querySelector('#source-file');
    const changeImageLabel = document.querySelector('[data-i18n="changeImage"]');
    const imageStage = document.querySelector('#image-stage');
    const preview = document.querySelector('#preview');
    const selectionOverlay = document.querySelector('#selection-overlay');
    const status = document.querySelector('#status');
    const jsonOutput = document.querySelector('#json-output');
    const copyButton = document.querySelector('#copy-json');
    const download = document.querySelector('#download-mask');
    const workspace = document.querySelector('#workspace');
    const layout = document.querySelector('.layout');
    const canvasViewport = document.querySelector('#canvas-viewport');
    const emptyCanvas = document.querySelector('#empty-canvas');
    const emptyGuide = document.querySelector('#empty-guide');
    const resultPanel = document.querySelector('#result-panel');
    const jsonPreview = document.querySelector('#json-preview');
    const promptInput = document.querySelector('#prompt-input');
    const promptCount = document.querySelector('#prompt-count');
    const noteNavigation = document.querySelector('#note-navigation');
    const overallTab = document.querySelector('#overall-tab');
    const areaTabs = document.querySelector('#area-tabs');
    const deleteNoteRegionButton = document.querySelector('#delete-note-region');
    const regionCount = document.querySelector('#region-count');
    const languageToggle = document.querySelector('#language-toggle');
    const websiteLink = document.querySelector('#website-link');
    const githubLink = document.querySelector('#github-link');
    const macTopChrome = document.querySelector('#mac-top-chrome');
    const focusButton = document.querySelector('#editor-focus');
    const dropTitle = emptyCanvas.querySelector('[data-i18n="dropTitle"]');
    const webShell = window.__flashMaskRequireWebAdapter === true;
    if (webShell) document.documentElement.classList.add('web-shell');
    const toolbar = document.querySelector('#floating-toolbar');
    const undoButton = document.querySelector('#undo-action');
    const clearButton = document.querySelector('#clear-action');
    const fitButton = document.querySelector('#fit-action');
    const actualSizeButton = document.querySelector('#actual-size-action');
    const zoomOutButton = document.querySelector('#zoom-out');
    const zoomInButton = document.querySelector('#zoom-in');
    const zoomLabel = document.querySelector('#zoom-label');
    const horizontalScrollbar = document.querySelector('#canvas-scrollbar-x');
    const verticalScrollbar = document.querySelector('#canvas-scrollbar-y');
    const horizontalScrollThumb = horizontalScrollbar.querySelector('.canvas-scroll-thumb');
    const verticalScrollThumb = verticalScrollbar.querySelector('.canvas-scroll-thumb');
    const toolbarHandle = document.querySelector('#toolbar-handle');
    const regionMenu = document.querySelector('#region-menu');
    const deleteRegionButton = document.querySelector('#delete-region-action');
    const bridge = () => window.webkit?.messageHandlers?.flashMaskBridge;
    const webAdapter = () => window.FlashMaskWebAdapter;
    const nativePathTimeoutMilliseconds = 1000;
    const edgeHitRadiusCss = 4;
    const supportedImageTypes = new Set(['image/png', 'image/jpeg', 'image/webp']);
    // ponytail: this limits only live pointer collection work; never truncate and emit a partial JSON.
    const maxCapturedSelectionPoints = 4096;
    const state = {
      task: null,
      output: null,
      selection: null,
      regions: [],
      selectedRegion: -1,
      selectedNode: -1,
      nextRegionId: 1,
      overallPrompt: '',
      noteScope: 'overall',
      noteRegionId: null,
      interaction: null,
      history: [],
      viewport: { zoom: 1, x: 0, y: 0 },
      toolbarPosition: null,
      scrollbarDrag: null,
      spaceDown: false,
      language: window.__flashMaskInitialLanguage ?? (navigator.language?.toLowerCase().startsWith('zh') ? 'zh' : 'en'),
      downloadUrl: null,
      ignoredPathResponses: 0,
      pathRequestNonce: null,
      acceptedPathResponseNonce: null,
      lastIgnoredPathResponseNonce: null,
      pendingNativeCopies: new Map(),
      copyMethod: null,
      notice: null,
      pendingImport: null
    };
    const regionEdgeIndexCache = new WeakMap();
    let renderedJson = null;
    let lastCanvasSize = null;
    let pendingMaskKeyboardExecution = null;
    let editorFocused = false;
    let emptyCanvasHovered = false;

    function beginResultExecution(action, event) {
      const adapter = webAdapter();
      if (!adapter) return window.__flashMaskRequireWebAdapter === true
        ? { allowed: false }
        : { allowed: true, adapter: null, ticket: null };
      if (typeof adapter.beginResult !== 'function' || typeof adapter.finishResult !== 'function') return { allowed: false };
      try {
        const ticket = adapter.beginResult(action, event?.isTrusted === true);
        return ticket?.allowed === true ? { allowed: true, adapter, ticket } : { allowed: false };
      } catch (error) {
        console.error('Flash Mask web result adapter failed to authorize.', error);
        return { allowed: false };
      }
    }

    function finishResultExecution(execution, outcome) {
      if (!execution?.adapter) return true;
      try { return execution.adapter.finishResult(execution.ticket, outcome) === true; }
      catch (error) {
        console.error('Flash Mask web result adapter failed to finish.', error);
        return false;
      }
    }

    function notifyWebTaskStarted(task) {
      pendingMaskKeyboardExecution = null;
      const adapter = webAdapter();
      if (task?.platform !== 'web' || typeof adapter?.taskStarted !== 'function') return;
      try { adapter.taskStarted(); }
      catch (error) { console.error('Flash Mask web result adapter failed to start a task.', error); }
    }

    const messages = {
      zh: {
        emptyJson: '圈出区域后，这里会生成可交给 Agent 的数据', chooseToGenerate: '选择图片后生成 JSON 和黑白蒙版。', decodeFailed: '图片无法解码。',
        importPreserved: '无法打开这张图片，已保留当前任务。', pathFailed: '无法取得真实路径，请重新导入。', pathPending: '正在取得真实本地路径。',
        outputReady: 'JSON 和黑白蒙版已就绪。', drawing: '正在圈选区域。', tooLong: '圈选轨迹过长，请重新圈选。', invalid: '圈选无效，请重新圈选。',
        continue: '继续圈选可增加区域；点击已有区域可调整。', draw: '按住鼠标圈选，松开即添加区域。', importing: '正在导入图片。', tooSmall: '圈选范围太小，请重新圈选。', outside: '圈选不能超出图片，请重新圈选。',
        overlap: '区域不能重叠，请重新圈选。', unavailable: '结果尚未就绪，不能复制。', copied: 'JSON 已复制。', copyChanged: '内容已变化，请再次复制。', copyFailed: '复制失败，请手动复制 JSON。', exportFailed: '蒙版生成失败，请重试。',
        selectAreaNote: '选择一个区域填写说明', areaPlaceholder: '只说明这个区域要怎样修改，可留空', overallPlaceholder: '对整张图片的要求，可留空'
      },
      en: {
        emptyJson: 'Outline an area to generate JSON for your AI agent.', chooseToGenerate: 'Choose an image to generate JSON and a black-and-white mask.', decodeFailed: 'We couldn’t open this image.',
        importPreserved: 'We couldn’t open this image. Your current work is unchanged.', pathFailed: 'We couldn’t access this file. Import it again.', pathPending: 'Finishing import…',
        outputReady: 'Your JSON and mask are ready.', drawing: 'Outlining an area…', tooLong: 'That outline is too complex. Try again with a shorter stroke.', invalid: 'That outline didn’t form a valid area. Try again.',
        continue: 'Outline another area, or click an existing one to adjust it.', draw: 'Click and drag to outline an area, then release.', importing: 'Importing image…', tooSmall: 'That selection is too small. Try again.', outside: 'Keep the selection inside the image and try again.',
        overlap: 'Selected areas can’t overlap. Try again.', unavailable: 'JSON isn’t ready to copy yet.', copied: 'JSON copied.', copyChanged: 'The JSON changed while it was being copied. Copy it again.', copyFailed: 'Couldn’t copy the JSON. Copy it from the preview instead.', exportFailed: 'Couldn’t generate the mask. Try again.',
        selectAreaNote: 'Select an area to add a note', areaPlaceholder: 'Describe this area’s edit, or leave blank', overallPlaceholder: 'Instructions for the whole image, or leave blank'
      }
    };
    const t = (key) => messages[state.language]?.[key] ?? messages.zh[key] ?? key;

    const pngDimensions = (bytes) => {
      if (String.fromCharCode(...bytes.subarray(12, 16)) !== 'IHDR') throw new Error('mask PNG is missing IHDR');
      const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
      return { width: view.getUint32(16), height: view.getUint32(20) };
    };

    const loadImage = (url) => {
      const image = new Image();
      let resolveLoad;
      let rejectLoad;
      let settled = false;
      const clearHandlers = () => { image.onload = null; image.onerror = null; };
      const promise = new Promise((resolve, reject) => { resolveLoad = resolve; rejectLoad = reject; });
      image.onload = () => {
        if (settled) return;
        settled = true;
        clearHandlers();
        resolveLoad(image);
      };
      image.onerror = () => {
        if (settled) return;
        settled = true;
        clearHandlers();
        rejectLoad(new Error('图片无法解码'));
      };
      image.src = url;
      return {
        image,
        promise,
        cancel() {
          if (settled) return false;
          settled = true;
          clearHandlers();
          image.src = '';
          rejectLoad(new DOMException('图片加载已取消', 'AbortError'));
          return true;
        }
      };
    };

    const isMacNotes = () => state.task?.platform === 'mac';
    const geometryPoints = (region) => region.map((point) => [...point]);
    function copyPoints(points) {
      const copy = geometryPoints(points);
      if (Number.isInteger(points.id) && points.id > 0) copy.id = points.id;
      copy.prompt = typeof points.prompt === 'string' ? points.prompt : '';
      return copy;
    }
    const copyRegions = (regions = state.regions) => regions.map(copyPoints);
    function snapshotRegions(regions = state.regions) {
      return regions.map(geometryPoints);
    }
    function bumpNextRegionId() {
      const maxId = state.regions.reduce((max, region) => Math.max(max, Number.isInteger(region.id) ? region.id : 0), 0);
      state.nextRegionId = Math.max(state.nextRegionId, maxId + 1);
    }
    function createRegion(points, prompt = '') {
      const region = geometryPoints(points);
      region.id = state.nextRegionId++;
      region.prompt = prompt;
      return region;
    }
    function withGeometry(source, points) {
      const next = points.map((point) => [...point]);
      if (Number.isInteger(source.id) && source.id > 0) next.id = source.id;
      next.prompt = typeof source.prompt === 'string' ? source.prompt : '';
      return next;
    }
    function noteRegion() {
      if (!isMacNotes() || state.noteScope !== 'area' || !Number.isInteger(state.noteRegionId)) return null;
      return state.regions.find((region) => region.id === state.noteRegionId) ?? null;
    }
    function setOverallNotes() {
      state.noteScope = 'overall';
      state.noteRegionId = null;
    }
    function setAreaNotes(region) {
      state.noteScope = 'area';
      state.noteRegionId = region.id;
    }
    function visiblePromptValue() {
      const region = noteRegion();
      if (region) return region.prompt ?? '';
      return state.overallPrompt;
    }
    function commitPromptInput() {
      const region = noteRegion();
      if (region) {
        region.prompt = promptInput.value;
        return;
      }
      if (isMacNotes() && state.noteScope === 'area') return;
      state.overallPrompt = promptInput.value;
    }
    function syncPromptInput() {
      const mac = isMacNotes();
      const macArea = mac && state.noteScope === 'area';
      const region = noteRegion();
      const hasArea = Boolean(macArea && region);
      promptInput.disabled = macArea && !hasArea;
      if (document.activeElement !== promptInput) promptInput.value = visiblePromptValue();
      if (!mac) {
        promptInput.placeholder = state.language === 'en' ? 'Example:\nKeep the mountain and remove the clouds.' : '例如：\n保留山体，去掉天空中的云。';
        return;
      }
      if (macArea && !hasArea) promptInput.placeholder = t('selectAreaNote');
      else if (macArea) promptInput.placeholder = t('areaPlaceholder');
      else promptInput.placeholder = t('overallPlaceholder');
    }

    function syntaxJson(json) {
      const escaped = json.replace(/[&<>]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[character]);
      return escaped.split('\n').map((line) => `<span class="line"><span class="line-content">${line.replace(/("(?:\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*")(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/g, (match, string, key) => `<span class="${key ? 'key' : string ? 'string' : match === 'null' ? 'null' : /true|false/.test(match) ? 'boolean' : 'number'}">${match}</span>`)}</span></span>`).join('');
    }

    function renderJsonPreview() {
      const json = state.output ? JSON.stringify(state.output.payload, null, 2) : null;
      const renderKey = `${state.language}\u0000${json ?? ''}`;
      if (renderKey === renderedJson) return;
      const scrollTop = jsonPreview.parentElement.scrollTop;
      jsonPreview.innerHTML = json ? syntaxJson(json) : `<span class="empty-json">${t('emptyJson')}</span>`;
      jsonPreview.parentElement.scrollTop = scrollTop;
      renderedJson = renderKey;
    }

    function renderNoteTabs() {
      const mac = isMacNotes();
      document.documentElement.classList.toggle('mac-notes', mac);
      noteNavigation.hidden = !mac;
      const focusedId = document.activeElement?.dataset?.area;
      overallTab.setAttribute('aria-pressed', String(state.noteScope === 'overall'));
      overallTab.classList.toggle('has-note', Boolean(state.overallPrompt.trim()));
      const noted = noteRegion();
      deleteNoteRegionButton.disabled = !(mac && noted);
      areaTabs.replaceChildren();
      if (mac) {
        for (const region of state.regions) {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'area-tab';
          if (typeof region.prompt === 'string' && region.prompt.trim()) button.classList.add('has-note');
          button.textContent = String(region.id);
          button.dataset.area = String(region.id);
          button.setAttribute('aria-pressed', String(state.noteScope === 'area' && region.id === state.noteRegionId));
          button.setAttribute('aria-label', state.language === 'en' ? `Area ${region.id}` : `区域 ${region.id}`);
          button.addEventListener('click', () => {
            commitPromptInput();
            state.selectedRegion = state.regions.indexOf(region);
            state.selectedNode = -1;
            setAreaNotes(region);
            promptInput.value = region.prompt ?? '';
            refreshPromptOnly();
            redrawSelection();
            render();
          });
          areaTabs.append(button);
        }
        if (focusedId) areaTabs.querySelector(`[data-area="${focusedId}"]`)?.focus();
      }
      syncPromptInput();
    }

    function render() {
      const task = state.task;
      imageStage.style.transform = `translate(${state.viewport.x}px, ${state.viewport.y}px) scale(${state.viewport.zoom})`;
      const ready = task?.imageStatus === 'ready';
      changeImageLabel.textContent = state.language === 'en' ? (ready ? 'Change Image' : 'Open Image') : (ready ? '更换图片' : '打开图片');
      layout.classList.toggle('ready', ready);
      imageStage.hidden = !ready;
      emptyCanvas.hidden = ready;
      emptyGuide.hidden = ready;
      resultPanel.hidden = !ready;
      toolbar.hidden = !ready;
      toolbar.classList.toggle('drawing', state.interaction?.type === 'draw');
      const viewportLocked = state.interaction?.type === 'draw';
      fitButton.disabled = viewportLocked;
      actualSizeButton.disabled = viewportLocked;
      zoomOutButton.disabled = viewportLocked;
      zoomInButton.disabled = viewportLocked;
      const taskChanging = Boolean(state.pendingImport);
      const downloadBlocked = !state.output || Boolean(state.interaction) || taskChanging;
      copyButton.disabled = downloadBlocked;
      download.classList.toggle('disabled', downloadBlocked);
      download.tabIndex = downloadBlocked ? -1 : 0;
      if (downloadBlocked) {
        if (document.activeElement === download) download.blur();
        download.removeAttribute('href');
        download.removeAttribute('download');
      } else if (state.downloadUrl) {
        download.href = state.downloadUrl;
        download.download = contract.maskFileName(task.fileName);
      }
      undoButton.disabled = state.history.length === 0 || Boolean(state.interaction);
      clearButton.disabled = state.regions.length === 0 || Boolean(state.interaction);
      zoomLabel.textContent = `${Math.round(state.viewport.zoom * 100)}%`;
      regionCount.textContent = state.language === 'zh' ? `${state.regions.length} 个区域` : `${state.regions.length} area${state.regions.length === 1 ? '' : 's'}`;
      renderNoteTabs();
      promptCount.textContent = String(promptInput.value.length);
      promptCount.hidden = promptInput.value.length === 0;
      updateCanvasScrollbars();
      renderJsonPreview();
      if (taskChanging) status.textContent = t('importing');
      else if (state.notice) status.textContent = t(state.notice);
      else if (!task) status.textContent = t('chooseToGenerate');
      else if (task.imageStatus === 'failed') status.textContent = t('decodeFailed');
      else if (task.platform === 'mac' && task.pathStatus === 'failed') status.textContent = t('pathFailed');
      else if (task.platform === 'mac' && task.pathStatus === 'pending') status.textContent = t('pathPending');
      else if (state.output) status.textContent = t('outputReady');
      else if (task.imageStatus === 'ready' && state.selection?.drawing) status.textContent = t('drawing');
      else if (task.imageStatus === 'ready' && state.selection?.exhausted) status.textContent = t('tooLong');
      else if (task.imageStatus === 'ready' && state.selection?.points.length) status.textContent = t('invalid');
      else if (task.imageStatus === 'ready' && state.regions.length) status.textContent = t('continue');
      else if (task.imageStatus === 'ready') status.textContent = t('draw');
      else status.textContent = t('importing');
      const showOnboarding = Boolean(ready && state.regions.length === 0 && !state.interaction && !taskChanging && !state.notice
        && !(task.platform === 'mac' && task.pathStatus !== 'ready'));
      status.classList.toggle('onboarding', showOnboarding);
      const showStatus = taskChanging || Boolean(state.notice)
        || Boolean(task && task.imageStatus !== 'ready')
        || Boolean(ready && task.platform === 'mac' && task.pathStatus !== 'ready')
        || Boolean(state.selection?.exhausted)
        || showOnboarding;
      status.hidden = !showStatus;
      lastCanvasSize = { width: canvasViewport.clientWidth, height: canvasViewport.clientHeight };
    }

    function handleWindowResize() {
      clampToolbar();
      const next = { width: canvasViewport.clientWidth, height: canvasViewport.clientHeight };
      const widthChange = lastCanvasSize ? next.width - lastCanvasSize.width : 0;
      const heightChange = lastCanvasSize ? next.height - lastCanvasSize.height : 0;
      if (state.task?.imageStatus === 'ready' && state.interaction?.type !== 'draw' && lastCanvasSize && next.width > 0 && next.height > 0 && (widthChange || heightChange)) {
        state.viewport = constrainViewport({
          zoom: state.viewport.zoom,
          x: state.viewport.x + widthChange / 2,
          y: state.viewport.y + heightChange / 2
        });
      }
      lastCanvasSize = next;
      render();
      redrawSelection();
    }

    function clearOutput() {
      state.output = null;
      state.copyMethod = null;
      jsonOutput.value = '';
      download.hidden = true;
      download.removeAttribute('href');
      download.removeAttribute('download');
      if (state.downloadUrl) URL.revokeObjectURL(state.downloadUrl);
      state.downloadUrl = null;
    }

    function revokeOwnedImageUrl(task) {
      if (!task?.ownedImageUrl || task.ownedImageUrlRevoked) return;
      URL.revokeObjectURL(task.ownedImageUrl);
      task.ownedImageUrlRevoked = true;
    }

    function disposeTask(task) {
      if (!task) return;
      if (task.platform === 'mac' && task.importNonce && !task.nativeReleaseSent) {
        task.nativeReleaseSent = true;
        try { bridge()?.postMessage({ type: 'import-release', import_nonce: task.importNonce }); } catch {}
      }
      task.imageLoad?.cancel();
      task.imageLoad = null;
      clearPathTimer(task);
      revokeOwnedImageUrl(task);
    }

    function drawPolygon(context, points, selected = false) {
      if (!points?.length) return;
      context.beginPath();
      context.moveTo(points[0][0], points[0][1]);
      for (let index = 1; index < points.length; index++) context.lineTo(points[index][0], points[index][1]);
      if (points.length >= 3) context.closePath();
      context.lineWidth = (selected ? 4.2 : 3.5) / state.viewport.zoom;
      context.strokeStyle = '#20272c';
      context.stroke();
      context.lineWidth = (selected ? 2.2 : 1.5) / state.viewport.zoom;
      context.strokeStyle = '#ffe500';
      context.fillStyle = selected ? 'rgba(255,229,0,.17)' : 'rgba(8,13,18,.16)';
      if (points.length >= 3) context.fill();
      context.stroke();
      if (selected) {
        const radius = 3.45 / state.viewport.zoom;
        points.forEach((point, index) => {
          context.beginPath();
          context.lineWidth = 1.5 / state.viewport.zoom;
          context.strokeStyle = '#20272c';
          context.fillStyle = index === state.selectedNode ? '#fff' : '#ffe500';
          context.arc(point[0], point[1], index === state.selectedNode ? radius * 1.45 : radius, 0, Math.PI * 2);
          context.fill();
          context.stroke();
        });
      }
      if (isMacNotes() && Number.isInteger(points.id)) {
        const zoom = state.viewport.zoom;
        const [x, y] = points[0];
        context.beginPath();
        context.fillStyle = selected ? '#ffe500' : '#171d22';
        context.arc(x, y, 10 / zoom, 0, Math.PI * 2);
        context.fill();
        context.strokeStyle = '#d8cc55';
        context.lineWidth = 1 / zoom;
        context.stroke();
        context.fillStyle = selected ? '#101418' : '#f5efb9';
        context.font = `600 ${11 / zoom}px -apple-system, sans-serif`;
        context.textAlign = 'center';
        context.textBaseline = 'middle';
        context.fillText(String(points.id), x, y);
      }
    }

    function redrawSelection() {
      const task = state.task;
      const width = task?.width ?? 0;
      const height = task?.height ?? 0;
      if (selectionOverlay.width !== width) selectionOverlay.width = width;
      if (selectionOverlay.height !== height) selectionOverlay.height = height;
      const context = selectionOverlay.getContext('2d');
      const selection = state.selection;
      context.clearRect(0, 0, selectionOverlay.width, selectionOverlay.height);
      if (selection?.exhausted) return;
      state.regions.forEach((region, index) => drawPolygon(context, region, index === state.selectedRegion));
      const points = selection?.points;
      if (!selection?.drawing || !points?.length) return;
      context.beginPath();
      context.moveTo(points[0][0], points[0][1]);
      for (let index = 1; index < points.length; index++) context.lineTo(points[index][0], points[index][1]);
      context.lineWidth = 2 / state.viewport.zoom;
      context.strokeStyle = selection.overlap ? '#ff6259' : '#ffe500';
      context.stroke();
    }

    function drawSelectionSegment(start, end) {
      const context = selectionOverlay.getContext('2d');
      context.beginPath();
      context.moveTo(start[0], start[1]);
      context.lineTo(end[0], end[1]);
      context.lineWidth = 2 / state.viewport.zoom;
      context.strokeStyle = '#ffe500';
      context.stroke();
    }

    function resetSelection() {
      state.selection = null;
      state.regions = [];
      state.selectedRegion = -1;
      state.selectedNode = -1;
      state.nextRegionId = 1;
      setOverallNotes();
      state.interaction = null;
      state.history = [];
      redrawSelection();
    }

    function selectionPoint(event) {
      const task = state.task;
      const bounds = selectionOverlay.getBoundingClientRect();
      if (!task?.width || !task?.height || !bounds.width || !bounds.height) return null;
      const raw = [event.clientX - bounds.left, event.clientY - bounds.top];
      const display = [
        Math.max(0, Math.min(bounds.width, raw[0])),
        Math.max(0, Math.min(bounds.height, raw[1]))
      ];
      return {
        image: [
          Math.round(display[0] * task.width / bounds.width),
          Math.round(display[1] * task.height / bounds.height)
        ],
        display,
        inside: raw[0] >= 0 && raw[0] <= bounds.width && raw[1] >= 0 && raw[1] <= bounds.height
      };
    }

    function appendSelectionPoint(point, force = false) {
      const selection = state.selection;
      if (!point || !selection || selection.exhausted) return false;
      const previous = selection.points.at(-1);
      if (previous && previous[0] === point.image[0] && previous[1] === point.image[1]) return false;
      if (!force && !selectionCleaner.isDisplayPointFarEnough(selection.displayPoints.at(-1), point.display)) return false;
      if (selection.points.length >= maxCapturedSelectionPoints) {
        selection.exhausted = true;
        state.notice = 'tooLong';
        redrawSelection();
        render();
        return false;
      }
      selection.points.push(point.image);
      selection.displayPoints.push(point.display);
      return true;
    }

    function pointerEventSequence(event) {
      let coalesced = [];
      try { coalesced = typeof event?.getCoalescedEvents === 'function' ? event.getCoalescedEvents() : []; } catch {}
      return coalesced?.length ? [...coalesced, event] : [event];
    }

    function processDrawPoint(event, force = false) {
      const selection = state.selection;
      const selected = selectionPoint(event);
      if (!selected || !selection) return false;
      if (!selected.inside && !selection.outside) {
        selection.outside = true;
        state.notice = 'outside';
        render();
      }
      const previousPointer = selection.lastPointerPoint;
      selection.lastPointerPoint = selected.image;
      if (!selection.overlap && previousPointer && selectionSegmentTouchesExistingRegion(previousPointer, selected.image)) {
        selection.overlap = true;
        state.notice = 'overlap';
        redrawSelection();
        render();
      }
      const previous = selection.points.at(-1);
      if (appendSelectionPoint(selected, force)) {
        drawSelectionSegment(previous, selection.points.at(-1));
        if (!selection.overlap && drawingTouchesExistingRegion(selection.points)) {
          selection.overlap = true;
          state.notice = 'overlap';
          redrawSelection();
          render();
        }
      }
      return true;
    }

    const distanceSquared = (a, b) => (a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2;
    const cross = (a, b, c) => (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);
    const onSegment = (point, a, b) => Math.abs(cross(a, b, point)) < 1e-9 && point[0] >= Math.min(a[0], b[0]) && point[0] <= Math.max(a[0], b[0]) && point[1] >= Math.min(a[1], b[1]) && point[1] <= Math.max(a[1], b[1]);

    function pointInPolygon(point, polygon, includeBoundary = true) {
      let inside = false;
      for (let index = 0, previous = polygon.length - 1; index < polygon.length; previous = index++) {
        const a = polygon[previous];
        const b = polygon[index];
        if (onSegment(point, a, b)) return includeBoundary;
        if ((a[1] > point[1]) !== (b[1] > point[1]) && point[0] < (b[0] - a[0]) * (point[1] - a[1]) / (b[1] - a[1]) + a[0]) inside = !inside;
      }
      return inside;
    }

    function segmentsProperlyCross(a, b, c, d) {
      const abC = cross(a, b, c);
      const abD = cross(a, b, d);
      const cdA = cross(c, d, a);
      const cdB = cross(c, d, b);
      return abC * abD < 0 && cdA * cdB < 0;
    }

    function collinearEdgesShareInterior(a, b, c, d, first, second) {
      if (Math.abs(cross(a, b, c)) > 1e-9 || Math.abs(cross(a, b, d)) > 1e-9) return false;
      const useX = Math.abs(b[0] - a[0]) >= Math.abs(b[1] - a[1]);
      const coordinate = (point) => point[useX ? 0 : 1];
      const start = Math.max(Math.min(coordinate(a), coordinate(b)), Math.min(coordinate(c), coordinate(d)));
      const end = Math.min(Math.max(coordinate(a), coordinate(b)), Math.max(coordinate(c), coordinate(d)));
      if (end - start <= 1e-9) return false;
      const amount = Math.abs(coordinate(b) - coordinate(a)) < 1e-9 ? .5 : ((start + end) / 2 - coordinate(a)) / (coordinate(b) - coordinate(a));
      const midpoint = [a[0] + amount * (b[0] - a[0]), a[1] + amount * (b[1] - a[1])];
      const length = Math.hypot(b[0] - a[0], b[1] - a[1]);
      if (!length) return false;
      const normal = [-(b[1] - a[1]) / length * .25, (b[0] - a[0]) / length * .25];
      return [1, -1].some((direction) => {
        const sample = [midpoint[0] + normal[0] * direction, midpoint[1] + normal[1] * direction];
        return pointInPolygon(sample, first, false) && pointInPolygon(sample, second, false);
      });
    }

    function buildRegionEdgeIndex(region) {
      const bounds = regionBounds(region);
      const cellsPerSide = Math.ceil(Math.sqrt(region.length));
      const cellSize = Math.max(1, Math.ceil(Math.max(bounds.maxX - bounds.minX, bounds.maxY - bounds.minY) / cellsPerSide));
      const cells = new Map();
      const edgeCells = (start, end) => {
        const x0 = (start[0] - bounds.minX) / cellSize;
        const y0 = (start[1] - bounds.minY) / cellSize;
        const x1 = (end[0] - bounds.minX) / cellSize;
        const y1 = (end[1] - bounds.minY) / cellSize;
        const dx = x1 - x0;
        const dy = y1 - y0;
        const keys = new Set();
        const add = (x, y) => keys.add(`${x},${y}`);
        let column = Math.floor(x0);
        let row = Math.floor(y0);
        const stepX = Math.sign(dx);
        const stepY = Math.sign(dy);
        const deltaX = stepX ? 1 / Math.abs(dx) : Infinity;
        const deltaY = stepY ? 1 / Math.abs(dy) : Infinity;
        let nextX = stepX > 0 ? (column + 1 - x0) / dx : stepX < 0 ? (x0 - column) / -dx : Infinity;
        let nextY = stepY > 0 ? (row + 1 - y0) / dy : stepY < 0 ? (y0 - row) / -dy : Infinity;
        add(column, row);
        const limit = Math.abs(Math.floor(x1) - column) + Math.abs(Math.floor(y1) - row) + 4;
        for (let traversed = 0; traversed < limit && Math.min(nextX, nextY) <= 1 + 1e-12; traversed++) {
          if (Math.abs(nextX - nextY) <= 1e-12) {
            add(column + stepX, row);
            add(column, row + stepY);
            column += stepX;
            row += stepY;
            nextX += deltaX;
            nextY += deltaY;
          } else if (nextX < nextY) {
            column += stepX;
            nextX += deltaX;
          } else {
            row += stepY;
            nextY += deltaY;
          }
          add(column, row);
        }
        if (y0 === y1 && Number.isInteger(y0)) [...keys].forEach((key) => { const [x, y] = key.split(',').map(Number); add(x, y - 1); });
        if (x0 === x1 && Number.isInteger(x0)) [...keys].forEach((key) => { const [x, y] = key.split(',').map(Number); add(x - 1, y); });
        return keys;
      };
      region.forEach((start, index) => {
        for (const key of edgeCells(start, region[(index + 1) % region.length])) {
          const entries = cells.get(key) ?? [];
          entries.push(index);
          cells.set(key, entries);
        }
      });
      return { bounds, cells, edgeCells };
    }

    function cachedRegionEdgeIndex(region) {
      let index = regionEdgeIndexCache.get(region);
      if (!index) {
        index = buildRegionEdgeIndex(region);
        regionEdgeIndexCache.set(region, index);
      }
      return index;
    }

    function segmentIntersectionAmounts(start, end, otherStart, otherEnd) {
      const dx = end[0] - start[0];
      const dy = end[1] - start[1];
      const otherDx = otherEnd[0] - otherStart[0];
      const otherDy = otherEnd[1] - otherStart[1];
      const denominator = dx * otherDy - dy * otherDx;
      if (Math.abs(denominator) > 1e-9) {
        const offsetX = otherStart[0] - start[0];
        const offsetY = otherStart[1] - start[1];
        const amount = (offsetX * otherDy - offsetY * otherDx) / denominator;
        const otherAmount = (offsetX * dy - offsetY * dx) / denominator;
        return amount >= -1e-9 && amount <= 1 + 1e-9 && otherAmount >= -1e-9 && otherAmount <= 1 + 1e-9
          ? [Math.max(0, Math.min(1, amount))] : [];
      }
      if (Math.abs(cross(start, end, otherStart)) > 1e-9 || Math.abs(cross(start, end, otherEnd)) > 1e-9) return [];
      const lengthSquared = dx * dx + dy * dy;
      if (!lengthSquared) return [];
      return [otherStart, otherEnd]
        .filter((point) => onSegment(point, start, end))
        .map((point) => Math.max(0, Math.min(1, ((point[0] - start[0]) * dx + (point[1] - start[1]) * dy) / lengthSquared)));
    }

    function amountsRunInside(start, end, amounts, polygon) {
      const ordered = [...new Set([0, 1, ...amounts].map((amount) => amount.toFixed(9)))].map(Number).sort((a, b) => a - b);
      return ordered.slice(1).some((endAmount, index) => {
        const startAmount = ordered[index];
        if (endAmount - startAmount < 1e-9) return false;
        const amount = (startAmount + endAmount) / 2;
        return pointInPolygon([
          start[0] + (end[0] - start[0]) * amount,
          start[1] + (end[1] - start[1]) * amount
        ], polygon, false);
      });
    }

    function segmentRunsInsideIndexed(start, end, polygon, index) {
      const candidates = new Set([...index.edgeCells(start, end)].flatMap((key) => index.cells.get(key) ?? []));
      const amounts = [];
      for (const edgeIndex of candidates) amounts.push(...segmentIntersectionAmounts(start, end, polygon[edgeIndex], polygon[(edgeIndex + 1) % polygon.length]));
      return amounts.length > 0 && amountsRunInside(start, end, amounts, polygon);
    }

    function translatedEdgeSweepHits(start, end, moveX, moveY, polygon, index) {
      const movedStart = [start[0] + moveX, start[1] + moveY];
      const movedEnd = [end[0] + moveX, end[1] + moveY];
      const sweep = [start, end, movedEnd, movedStart];
      const candidates = new Set();
      for (let edge = 0; edge < sweep.length; edge++) {
        for (const key of index.edgeCells(sweep[edge], sweep[(edge + 1) % sweep.length])) {
          for (const candidate of index.cells.get(key) ?? []) candidates.add(candidate);
        }
      }
      for (const candidate of candidates) {
        const obstacleStart = polygon[candidate];
        const obstacleEnd = polygon[(candidate + 1) % polygon.length];
        const amounts = [];
        for (let edge = 0; edge < sweep.length; edge++) {
          amounts.push(...segmentIntersectionAmounts(obstacleStart, obstacleEnd, sweep[edge], sweep[(edge + 1) % sweep.length]));
        }
        if ((amounts.length && amountsRunInside(obstacleStart, obstacleEnd, amounts, sweep))
          || pointInPolygon(obstacleStart, sweep, false) || pointInPolygon(obstacleEnd, sweep, false)) return true;
      }
      return false;
    }

    function regionsOverlap(first, second, secondIndex = null, firstBounds = regionBounds(first)) {
      if (first === second) return true;
      const index = secondIndex ?? buildRegionEdgeIndex(second);
      const secondBounds = index.bounds;
      if (!boundsOverlap(firstBounds, secondBounds)) return false;
      const { cells, edgeCells } = index;
      const secondEdgeAmounts = new Map();
      for (let firstIndex = 0; firstIndex < first.length; firstIndex++) {
        const a = first[firstIndex];
        const b = first[(firstIndex + 1) % first.length];
        const candidates = new Set([...edgeCells(a, b)].flatMap((key) => cells.get(key) ?? []));
        const firstAmounts = [];
        for (const candidateIndex of candidates) {
          const c = second[candidateIndex];
          const d = second[(candidateIndex + 1) % second.length];
          if (segmentsProperlyCross(a, b, c, d) || collinearEdgesShareInterior(a, b, c, d, first, second)) return true;
          const amounts = segmentIntersectionAmounts(a, b, c, d);
          if (!amounts.length) continue;
          firstAmounts.push(...amounts);
          const reverse = segmentIntersectionAmounts(c, d, a, b);
          if (reverse.length) secondEdgeAmounts.set(candidateIndex, [...(secondEdgeAmounts.get(candidateIndex) ?? []), ...reverse]);
        }
        if (firstAmounts.length && amountsRunInside(a, b, firstAmounts, second)) return true;
      }
      for (const [edgeIndex, amounts] of secondEdgeAmounts) {
        if (amountsRunInside(second[edgeIndex], second[(edgeIndex + 1) % second.length], amounts, first)) return true;
      }
      return pointInPolygon(first[0], second, false) || pointInPolygon(second[0], first, false);
    }

    function overlapsOtherRegion(points, ignoredIndex = -1) {
      return state.regions.some((region, index) => index !== ignoredIndex && regionsOverlap(points, region, cachedRegionEdgeIndex(region)));
    }

    function regionBounds(points) {
      return points.reduce((bounds, [x, y]) => ({
        minX: Math.min(bounds.minX, x), minY: Math.min(bounds.minY, y),
        maxX: Math.max(bounds.maxX, x), maxY: Math.max(bounds.maxY, y)
      }), { minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity });
    }

    function boundsOverlap(first, second) {
      return first.minX < second.maxX && first.maxX > second.minX && first.minY < second.maxY && first.maxY > second.minY;
    }

    function selectionSegmentTouchesExistingRegion(start, end) {
      return state.regions.some((region) => pointInPolygon(end, region, false)
        || segmentRunsInsideIndexed(start, end, region, cachedRegionEdgeIndex(region)));
    }

    function drawingTouchesExistingRegion(points) {
      return points.length >= 2 && selectionSegmentTouchesExistingRegion(points.at(-2), points.at(-1));
    }

    function closestSegment(point, polygon) {
      let closest = null;
      for (let index = 0; index < polygon.length; index++) {
        const start = polygon[index];
        const end = polygon[(index + 1) % polygon.length];
        const dx = end[0] - start[0];
        const dy = end[1] - start[1];
        const lengthSquared = dx * dx + dy * dy;
        const amount = lengthSquared ? Math.max(0, Math.min(1, ((point[0] - start[0]) * dx + (point[1] - start[1]) * dy) / lengthSquared)) : 0;
        const projected = [Math.round(start[0] + amount * dx), Math.round(start[1] + amount * dy)];
        const candidate = { index, point: projected, distance: Math.sqrt(distanceSquared(point, projected)) };
        if (!closest || candidate.distance < closest.distance) closest = candidate;
      }
      return closest;
    }

    function isEditableEdge(point, polygon, segment = closestSegment(point, polygon)) {
      if (!segment) return false;
      const radiusCss = pointInPolygon(point, polygon, false) ? 2 : edgeHitRadiusCss;
      return segment.distance <= radiusCss / state.viewport.zoom;
    }

    function hitNode(point) {
      if (state.selectedRegion < 0) return null;
      const radiusSquared = (8 / state.viewport.zoom) ** 2;
      const regionIndex = state.selectedRegion;
      let closest = null;
      state.regions[regionIndex]?.forEach((node, nodeIndex) => {
        const distance = distanceSquared(point, node);
        if (distance <= radiusSquared && (!closest || distance < closest.distance)) closest = { regionIndex, nodeIndex, distance };
      });
      return closest ? { regionIndex, nodeIndex: closest.nodeIndex } : null;
    }

    function hitRegion(point) {
      for (let index = state.regions.length - 1; index >= 0; index--) if (pointInPolygon(point, state.regions[index])) return index;
      return -1;
    }

    function hitOtherRegionInterior(point) {
      for (let index = state.regions.length - 1; index >= 0; index--) {
        if (index !== state.selectedRegion && pointInPolygon(point, state.regions[index], false)) return index;
      }
      return -1;
    }

    function saveHistory(regions = state.regions) {
      state.history.push(copyRegions(regions));
      if (state.history.length > 50) state.history.shift();
    }

    const regionsEqual = (first, second) => JSON.stringify(first) === JSON.stringify(second);

    function validEditedRegion(region, index) {
      const task = state.task;
      if (!task || region.some(([x, y]) => x < 0 || y < 0 || x > task.width || y > task.height) || overlapsOtherRegion(region, index)) return false;
      try {
        contract.createPayload({ platform: 'web', sourceImage: { file_name: task.fileName, width: task.width, height: task.height }, regions: [region] });
        return true;
      } catch { return false; }
    }

    function pathBoundsOverlap(start, end, bounds) {
      return Math.min(start[0], end[0]) <= bounds.maxX && Math.max(start[0], end[0]) >= bounds.minX
        && Math.min(start[1], end[1]) <= bounds.maxY && Math.max(start[1], end[1]) >= bounds.minY;
    }

    function translationSweepOverlaps(region, dx, dy, amount, nearby, movingGeometry = null) {
      const moveX = dx * amount;
      const moveY = dy * amount;
      const destination = region.map(([x, y]) => [x + moveX, y + moveY]);
      const destinationBounds = regionBounds(destination);
      for (const entry of nearby) {
        if (boundsOverlap(destinationBounds, entry.bounds) && regionsOverlap(destination, entry.region, entry.edgeIndex, destinationBounds)) return true;
        for (let edge = 0; edge < region.length; edge++) {
          const start = region[edge];

    emptyCanvas.addEventListener('click', (event) => {
      if (!webShell || event.target.closest('label[for="source-file"]')) return;
      fileInput.click();
    });
    canvasViewport.addEventListener('dragenter', (event) => {
      if (webShell && !isSupportedImageDrag(event)) {
        if (event.dataTransfer) event.dataTransfer.dropEffect = 'none';
        setDropReady(false);
        return;
      }
      event.preventDefault();
      setDropReady(true);
    });
    canvasViewport.addEventListener('dragover', (event) => {
      if (webShell) {
        const ready = isSupportedImageDrag(event);
        if (event.dataTransfer) event.dataTransfer.dropEffect = ready ? 'copy' : 'none';
        if (!ready) {
          setDropReady(false);
          return;
        }
      }
      event.preventDefault();
      setDropReady(true);
    });
    canvasViewport.addEventListener('dragleave', (event) => {
      if (!canvasViewport.contains(event.relatedTarget)) setDropReady(false);
    });
    canvasViewport.addEventListener('drop', (event) => {
      event.preventDefault();
      setDropReady(false);
      importWebFile(event.dataTransfer?.files?.[0]);
    });
    canvasViewport.addEventListener('wheel', (event) => {
      if (event.ctrlKey || event.metaKey) {
        if (!state.task) return;
        event.preventDefault();
        if (state.interaction?.type !== 'draw') {
          zoomAt(state.viewport.zoom * (event.deltaY < 0 ? 1.12 : .89), event.clientX, event.clientY);
        }
        return;
      }
      if (state.interaction?.type === 'draw') {
        event.preventDefault();
        return;
      }
      const shiftHorizontal = event.shiftKey && event.deltaX === 0;
      const rawX = shiftHorizontal ? event.deltaY : event.deltaX;
      const rawY = shiftHorizontal ? 0 : event.deltaY;
      const dx = rawX * (event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? canvasViewport.clientWidth : 1);
      const dy = rawY * (event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? canvasViewport.clientHeight : 1);
      const overflowX = (state.task?.width || 0) * state.viewport.zoom - canvasViewport.clientWidth;
      const overflowY = (state.task?.height || 0) * state.viewport.zoom - canvasViewport.clientHeight;
      if (webShell && overflowX <= .5 && overflowY <= .5) {
        event.preventDefault();
        webAdapter()?.requestPageScroll?.(dx, dy);
        return;
      }
      if (!state.task) return;
      event.preventDefault();
      panViewport(dx, dy);
    }, { passive: false });
    promptInput.addEventListener('input', () => {
      state.notice = null;
      commitPromptInput();
      refreshPromptOnly();
    });
    overallTab.addEventListener('click', () => {
      commitPromptInput();
      setOverallNotes();
      promptInput.disabled = false;
      promptInput.value = state.overallPrompt;
      refreshPromptOnly();
      render();
    });
    deleteNoteRegionButton.addEventListener('click', () => {
      const region = noteRegion();
      if (!region) return;
      state.selectedRegion = state.regions.indexOf(region);
      deleteSelectedRegion();
    });
    undoButton.addEventListener('click', undo);
    clearButton.addEventListener('click', clearRegions);
    fitButton.addEventListener('click', fitViewport);
    actualSizeButton.addEventListener('click', () => zoomAt(1));
    zoomOutButton.addEventListener('click', () => zoomAt(state.viewport.zoom / 1.2));
    zoomInButton.addEventListener('click', () => zoomAt(state.viewport.zoom * 1.2));
    horizontalScrollThumb.addEventListener('pointerdown', (event) => beginScrollbarDrag('x', event));
    verticalScrollThumb.addEventListener('pointerdown', (event) => beginScrollbarDrag('y', event));
    horizontalScrollThumb.addEventListener('pointermove', moveScrollbar);
    verticalScrollThumb.addEventListener('pointermove', moveScrollbar);
    horizontalScrollThumb.addEventListener('pointerup', finishScrollbarDrag);
    verticalScrollThumb.addEventListener('pointerup', finishScrollbarDrag);
    horizontalScrollThumb.addEventListener('pointercancel', finishScrollbarDrag);
    verticalScrollThumb.addEventListener('pointercancel', finishScrollbarDrag);
    horizontalScrollbar.addEventListener('keydown', (event) => keyboardScroll('x', event));
    verticalScrollbar.addEventListener('keydown', (event) => keyboardScroll('y', event));
    deleteRegionButton.addEventListener('click', deleteSelectedRegion);
    toolbarHandle.addEventListener('pointerdown', (event) => {
      if (event.button !== 0 || state.toolbarPosition || state.interaction) return;
      const bounds = toolbar.getBoundingClientRect();
      state.toolbarPosition = { offsetX: event.clientX - bounds.left, offsetY: event.clientY - bounds.top, pointerId: event.pointerId };
      toolbarHandle.setPointerCapture(event.pointerId);
      event.preventDefault();
    });
    toolbarHandle.addEventListener('pointermove', moveToolbar);
    toolbarHandle.addEventListener('pointerup', finishToolbarDrag);
    toolbarHandle.addEventListener('pointercancel', finishToolbarDrag);
    toolbarHandle.addEventListener('lostpointercapture', finishToolbarDrag);
    document.addEventListener('pointerdown', (event) => { if (!regionMenu.hidden && !regionMenu.contains(event.target)) regionMenu.hidden = true; });
    document.addEventListener('keydown', (event) => {
      const activeElement = document.activeElement;
      const editingText = activeElement instanceof HTMLElement && ((/^(INPUT|TEXTAREA)$/.test(activeElement.tagName) && !activeElement.readOnly && !activeElement.disabled) || activeElement.isContentEditable);
      const interactiveTarget = event.target instanceof Element && Boolean(event.target.closest('button,a[href],label,select,input,textarea,[contenteditable="true"]'));
      if (event.code === 'Space' && !editingText && !interactiveTarget) { state.spaceDown = true; selectionOverlay.style.cursor = 'grab'; event.preventDefault(); return; }
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'z' && !editingText) { event.preventDefault(); undo(); return; }
      if (event.key === 'Escape') {
        cancelCurrentInteraction();
        cancelAuxiliaryDrags();
        if (webShell && editorFocused) webAdapter()?.requestFocus?.(false);
        return;
      }
      if (!editingText && (event.key === 'Delete' || event.key === 'Backspace')) {
        event.preventDefault();
        if (state.selectedNode >= 0) deleteSelectedNode();
        else deleteSelectedRegion();
      }
    });
    document.addEventListener('keyup', (event) => { if (event.code === 'Space') releaseSpacePan(); });
    window.addEventListener('blur', () => { if (state.interaction) cancelCurrentInteraction(); cancelAuxiliaryDrags(); releaseSpacePan(); });
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) return;
      if (state.interaction) cancelCurrentInteraction();
      cancelAuxiliaryDrags();
      releaseSpacePan();
    });
    window.addEventListener('resize', handleWindowResize);
    window.addEventListener('unload', () => { disposeTask(state.task); disposeTask(state.pendingImport); });
    const macHost = Boolean(bridge());
    macTopChrome.hidden = !macHost;
    languageToggle.hidden = !macHost;
    websiteLink.hidden = !macHost;
    githubLink.hidden = !macHost;
    if (focusButton) focusButton.hidden = !webShell;
    languageToggle.addEventListener('click', () => {
      const language = state.language === 'zh' ? 'en' : 'zh';
      setLanguage(language);
      bridge()?.postMessage({ type: 'language-preference', language });
    });
    websiteLink.addEventListener('click', () => bridge()?.postMessage({ type: 'open-external', destination: 'website' }));
    githubLink.addEventListener('click', () => bridge()?.postMessage({ type: 'open-external', destination: 'github' }));
    focusButton?.addEventListener('click', () => {
      if (!webShell) return;
      webAdapter()?.requestFocus?.(!editorFocused);
    });
    window.FlashMaskP0 = {
      importWebFile,
      beginMacImport: (request) => beginImport({ platform: 'mac', import_nonce: request.import_nonce, file_name: request.file_name, image_url: request.image_url, origin: request.origin }),
      needsReplaceConfirmation: () => {
        commitPromptInput();
        if (state.regions.length > 0) return true;
        if (String(state.overallPrompt || '').trim()) return true;
        return state.regions.some((region) => String(region.prompt || '').trim());
      },
      setNativeDragHighlight: (request) => canvasViewport.classList.toggle('dragging', request?.active === true),
      acceptNativePath,
      acceptNativeCopy,
      copyResult,
      setViewport,
      fitViewport,
      prepareMaskDownload,
      undo,
      setLanguage,
      setFocusState,
      clearRegions,
      snapshot
    };
    setLanguage(state.language);
  })();
</script>
</body>
</html>
